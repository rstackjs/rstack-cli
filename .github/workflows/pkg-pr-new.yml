name: Publish Package Previews

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native:
    name: Build native packages
    if: github.event.pull_request.draft == false
    uses: ./.github/workflows/reusable-native-release.yml

  publish:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          package-manager-cache: false

      - name: Install Pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: true

      - name: Build Packages
        run: node --run build

      - name: Prepare release
        run: node --run release:prepare

      - name: Download native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-packages
          path: packages/rstack/npm

      - name: Prepare native packages
        run: pnpm --dir packages/rstack exec napi pre-publish --config-path napi.json --skip-optional-publish --no-gh-release

      - name: Publish Package Previews
        run: >-
          pnpm exec pkg-pr-new publish --pnpm --previewVersion --no-template
          './packages/rstack' './packages/create-rstack' './packages/rstack/npm/*'
