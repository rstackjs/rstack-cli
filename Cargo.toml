[workspace]
members = ["crates/rstack-binding"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/rstackjs/rstack-cli"
rust-version = "1.88"

[workspace.dependencies]
napi = { version = "3.12.0", default-features = false, features = ["napi9"] }
napi-build = "2.4.0"
napi-derive = "3.6.2"

[profile.release]
lto = true
strip = "symbols"
