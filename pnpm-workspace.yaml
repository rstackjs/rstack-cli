packages:
  - packages/*
  - examples/*
  - website

autoDedupe: true

allowBuilds:
  core-js: false
  simple-git-hooks: false

catalogMode: prefer

cleanupUnusedCatalogs: true

catalog:
  '@napi-rs/cli': '^3.10.12'
  '@rsbuild/core': '~2.3.1'
  '@rsbuild/plugin-react': '^2.1.1'
  '@rsbuild/plugin-sass': '^2.0.1'
  '@rslib/core': '~1.0.6'
  '@rslint/core': '0.10.0'
  '@rspress/core': '2.1.1'
  '@rspress/plugin-client-redirects': '2.1.1'
  '@rstackjs/doc-ui': '1.14.11'
  '@rstackjs/create-toolkit': '2.2.11'
  '@rstackjs/load-config': ^1.0.2
  '@rstackjs/test-utils': ^1.0.0
  '@rstest/adapter-rsbuild': '~0.12.6'
  '@rstest/adapter-rslib': '~0.12.6'
  '@rstest/core': '~0.12.6'
  '@swc-next/parser': '0.5.0'
  '@testing-library/dom': '^10.4.2'
  '@testing-library/jest-dom': '^7.0.1'
  '@testing-library/react': '^16.3.3'
  '@types/micromatch': '^4.0.10'
  '@types/node': '^26.6.6'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  'cspell-ban-words': '^0.0.4'
  'fast-json-stable-stringify': '2.1.0'
  'happy-dom': '^21.0.4'
  'heading-case': '^2.0.3'
  'import-meta-resolve': '4.2.0'
  is-binary-path: 3.0.0
  'lint-staged': '^17.6.0'
  'micromatch': '4.0.8'
  pkg-pr-new: 0.0.87
  prettier: '3.9.10'
  'prettier-plugin-tailwindcss': '0.8.1'
  'prettier-plugin-svelte': '^4.1.1'
  'react': '^19.3.1'
  'react-dom': '^19.3.1'
  'rsbuild-plugin-open-graph': '^1.1.3'
  rslog: ^2.3.0
  'rspress-plugin-font-open-sans': '^1.0.4'
  # v4 requires Node.js 22.
  'sort-package-json': '3.7.1'
  svelte: '^5.57.3'
  tinypool: '2.2.0'
  tiny-readdir: 3.1.1
  'typescript': '^7.0.2'
  'vscode-languageserver': '11.0.0'
  'vscode-languageserver-textdocument': '1.0.16'
  'zephyr-rspress-plugin': '1.7.0'

dedupePeers: true

autoInstallPeers: false

engineStrict: true

hoistPattern: []

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@swc-next/*'
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rslint/*'
  - '@rstackjs/*'
  - 'rslog'
  - 'rsbuild-plugin-*'
  - '@swc/*'
  - 'heading-case'
