packages:
  - packages/*
  - examples/*
  - website

autoDedupe: true

allowBuilds:
  core-js: false
  simple-git-hooks: false

catalogMode: prefer

cleanupUnusedCatalogs: true

catalog:
  '@napi-rs/cli': '^3.10.8'
  '@rsbuild/core': '~2.2.12'
  '@rsbuild/plugin-react': '^2.1.1'
  '@rsbuild/plugin-sass': '^2.0.1'
  '@rslib/core': '~1.0.3'
  '@rslint/core': '0.9.4'
  '@rspress/core': '^2.0.23'
  '@rspress/plugin-client-redirects': '^2.0.23'
  '@rspress/plugin-sitemap': '^2.0.23'
  '@rstackjs/doc-ui': '1.14.11'
  '@rstackjs/create-toolkit': '2.2.7'
  '@rstackjs/load-config': ^1.0.1
  '@rstackjs/test-utils': ^1.0.0
  '@rstest/adapter-rsbuild': '~0.12.3'
  '@rstest/adapter-rslib': '~0.12.3'
  '@rstest/core': '~0.12.3'
  '@swc-next/parser': '0.2.3'
  '@testing-library/dom': '^10.4.2'
  '@testing-library/jest-dom': '^7.0.1'
  '@testing-library/react': '^16.3.3'
  '@types/micromatch': '^4.0.10'
  '@types/node': '^26.6.4'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@shikijs/transformers': '^4.5.0'
  'cspell-ban-words': '^0.0.4'
  'fast-json-stable-stringify': '2.1.0'
  'happy-dom': '^20.14.5'
  'heading-case': '^2.0.2'
  'import-meta-resolve': '4.2.0'
  is-binary-path: 3.0.0
  'lint-staged': '^17.6.0'
  'micromatch': '4.0.8'
  prettier: '3.9.9'
  'prettier-plugin-tailwindcss': '0.8.1'
  'prettier-plugin-svelte': '^4.1.1'
  'react': '^19.3.0'
  'react-dom': '^19.3.0'
  'rsbuild-plugin-open-graph': '^1.1.3'
  rslog: ^2.3.0
  'rspress-plugin-font-open-sans': '^1.0.4'
  'sort-package-json': '4.0.0'
  svelte: '^5.57.2'
  tinypool: '2.2.0'
  tiny-readdir: 3.1.1
  'typescript': '^7.0.2'
  'vscode-languageserver': '10.1.2'
  'vscode-languageserver-textdocument': '1.0.15'
  'zephyr-rspress-plugin': '1.6.0'

dedupePeers: true

autoInstallPeers: false

engineStrict: true

hoistPattern: []

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@swc-next/*'
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rslint/*'
  - '@rstackjs/*'
  - 'rslog'
  - 'rsbuild-plugin-*'
  - '@swc/*'
  - 'heading-case'
