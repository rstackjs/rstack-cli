packages:
  - packages/*
  - examples/*
  - website

allowBuilds:
  core-js: false
  simple-git-hooks: false

catalogMode: prefer

cleanupUnusedCatalogs: true

catalog:
  '@napi-rs/cli': '^3.8.6'
  '@rsbuild/core': '~2.2.2'
  '@rsbuild/plugin-react': '^2.1.0'
  '@rsbuild/plugin-sass': '^2.0.1'
  '@rslib/core': '~1.0.0'
  '@rslint/core': '0.9.0'
  '@rspress/core': '^2.0.21'
  '@rspress/plugin-client-redirects': '^2.0.21'
  '@rspress/plugin-sitemap': '^2.0.21'
  '@rstackjs/doc-ui': '1.14.11'
  '@rstackjs/create-toolkit': '2.2.4'
  '@rstackjs/load-config': ^0.1.2
  '@rstackjs/test-utils': ^0.2.0
  '@rstest/adapter-rsbuild': '~0.11.11'
  '@rstest/adapter-rslib': '~0.11.11'
  '@rstest/core': '~0.11.11'
  '@testing-library/dom': '^10.4.1'
  '@testing-library/jest-dom': '^7.0.1'
  '@testing-library/react': '^16.3.3'
  '@types/micromatch': '^4.0.10'
  '@types/node': '^26.4.0'
  '@types/react': '^19.2.18'
  '@types/react-dom': '^19.2.5'
  '@shikijs/transformers': '^4.4.3'
  'cspell-ban-words': '^0.0.4'
  'fast-json-stable-stringify': '2.1.0'
  'happy-dom': '^20.12.0'
  'heading-case': '^2.0.1'
  'import-meta-resolve': '4.2.0'
  is-binary-path: 3.0.0
  'lint-staged': '^17.4.1'
  'micromatch': '4.0.8'
  prettier: '3.9.6'
  'prettier-plugin-tailwindcss': '0.8.1'
  'prettier-plugin-svelte': '^4.1.1'
  'react': '^19.2.8'
  'react-dom': '^19.2.8'
  'rsbuild-plugin-open-graph': '^1.1.3'
  rslog: ^2.3.0
  'rspress-plugin-font-open-sans': '^1.0.4'
  'sort-package-json': '4.0.0'
  svelte: '^5.57.0'
  tinypool: '2.1.2'
  tiny-readdir: 3.1.1
  'typescript': '^7.0.2'
  'vscode-languageserver': '10.1.1'
  'vscode-languageserver-textdocument': '1.0.14'
  yuku-parser: '0.9.3'

dedupePeers: true

autoInstallPeers: false

engineStrict: true

hoistPattern: []

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@yuku-parser/binding-android-arm64@0.8.3'
  - '@yuku-parser/binding-darwin-arm64@0.8.3'
  - '@yuku-parser/binding-darwin-x64@0.8.3'
  - '@yuku-parser/binding-freebsd-x64@0.8.3'
  - '@yuku-parser/binding-linux-arm-gnu@0.8.3'
  - '@yuku-parser/binding-linux-arm-musl@0.8.3'
  - '@yuku-parser/binding-linux-arm64-gnu@0.8.3'
  - '@yuku-parser/binding-linux-arm64-musl@0.8.3'
  - '@yuku-parser/binding-linux-x64-gnu@0.8.3'
  - '@yuku-parser/binding-linux-x64-musl@0.8.3'
  - '@yuku-parser/binding-win32-arm64@0.8.3'
  - '@yuku-parser/binding-win32-x64@0.8.3'
  - '@yuku-toolchain/types@0.8.3'
  - 'yuku-ast@0.8.3'
  - 'yuku-parser@0.8.3'
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rslint/*'
  - '@rstackjs/*'
  - 'rslog'
  - 'rsbuild-plugin-*'
  - '@swc/*'
  - 'heading-case'
