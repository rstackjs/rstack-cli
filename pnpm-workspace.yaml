packages:
  - packages/*
  - examples/*
  - website

allowBuilds:
  core-js: false
  simple-git-hooks: false

catalogMode: prefer

cleanupUnusedCatalogs: true

catalog:
  '@rsbuild/core': '~2.1.9'
  '@rsbuild/plugin-react': '^2.1.0'
  '@rsbuild/plugin-sass': '^2.0.1'
  '@rslib/core': '~1.0.0-beta.1'
  '@rslint/core': '~0.7.2'
  '@rspress/core': '^2.0.19'
  '@rspress/plugin-client-redirects': '^2.0.19'
  '@rspress/plugin-sitemap': '^2.0.19'
  '@rstack-dev/doc-ui': '1.14.7'
  '@rstackjs/load-config': ^0.1.2
  '@rstackjs/test-utils': ^0.2.0
  '@rstest/adapter-rsbuild': '~0.11.5'
  '@rstest/adapter-rslib': '~0.11.5'
  '@rstest/core': '~0.11.5'
  '@testing-library/dom': '^10.4.1'
  '@testing-library/jest-dom': '^7.0.0'
  '@testing-library/react': '^16.3.2'
  '@types/micromatch': '^4.0.10'
  '@types/node': '^24.13.3'
  '@types/react': '^19.2.18'
  '@types/react-dom': '^19.2.4'
  '@shikijs/transformers': '^4.3.1'
  atomically: '2.1.1'
  'cspell-ban-words': '^0.0.4'
  'fast-ignore': '2.0.0'
  'happy-dom': '^20.11.1'
  'heading-case': '^1.1.4'
  ignore: 7.0.6
  'import-meta-resolve': '4.2.0'
  is-binary-path: 3.0.0
  'lint-staged': '^17.2.0'
  'micromatch': '4.0.8'
  prettier: '3.9.6'
  'prettier-plugin-packagejson': '^3.0.2'
  'react': '^19.2.8'
  'react-dom': '^19.2.8'
  'rsbuild-plugin-open-graph': '^1.1.3'
  rslog: ^2.3.0
  'rspress-plugin-font-open-sans': '^1.0.4'
  tiny-readdir: 3.1.1
  'typescript': '^7.0.2'
  worktank: '3.0.2'

dedupePeers: true

autoInstallPeers: false

engineStrict: true

hoistPattern: []

# Reduce the risk of installing compromised packages
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@rspack/*'
  - '@rsbuild/*'
  - '@rslib/*'
  - '@rspress/*'
  - '@rstest/*'
  - '@rslint/*'
  - '@rstackjs/*'
  - 'rslog'
  - '@rstack-dev/doc-ui'
  - 'rsbuild-plugin-*'
  - '@swc/*'
  - 'heading-case'
